name: Synthetic reproducibility tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python -m clinical_rag ingest --hosp tests/fixtures/hosp --notes tests/fixtures/note --labs --prescriptions --synthetic --db artifacts/ci.sqlite
      - run: python -m clinical_rag evaluate --db artifacts/ci.sqlite --cases tests/fixtures/cases.jsonl --split all --out artifacts/evaluation.json
      - run: python -m clinical_rag benchmark --db artifacts/ci.sqlite --cases tests/fixtures/cases.jsonl --split all --backend extractive --out artifacts/benchmark.json
